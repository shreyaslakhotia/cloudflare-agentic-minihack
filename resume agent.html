<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Orchestrator</title>
    <!-- Load Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Apply Inter font */
        html {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for loading spinner */
        .spinner {
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <!-- Load Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        
        <!-- Header -->
        <h1 class="text-2xl font-bold text-gray-800 text-center">Agent Orchestrator</h1>
        <p class="text-gray-500 text-center mt-2 mb-6">Enter your details to find and orchestrate agents via n8n.</p>

        <!-- Form -->
        <form id="agent-form" class="space-y-5">
            
            <!-- Salary Input -->
            <div>
                <label for="salary" class="block text-sm font-medium text-gray-700 mb-1">Desired Salary (USD)</label>
                <input 
                    type="number" 
                    id="salary" 
                    name="salary" 
                    placeholder="e.g., 80000"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                >
            </div>
            
            <!-- Location Input -->
            <div>
                <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Current Location</label>
                <input 
                    type="text" 
                    id="location" 
                    name="location"
                    placeholder="e.g., Singapore"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                >
            </div>

            <!-- Nationality Input -->
            <div>
                <label for="nationality" class="block text-sm font-medium text-gray-700 mb-1">Nationality</label>
                <input 
                    type="text" 
                    id="nationality" 
                    name="nationality"
                    placeholder="e.g., American"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                >
            </div>

            <!-- Industry Input -->
            <div>
                <label for="industry" class="block text-sm font-medium text-gray-700 mb-1">Industry</label>
                <input 
                    type="text" 
                    id="industry" 
                    name="industry"
                    placeholder="e.g., Technology, Finance"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                >
            </div>

            <!-- Desired Job Field Input -->
            <div>
                <label for="job_field" class="block text-sm font-medium text-gray-700 mb-1">Desired Job Field</label>
                <input 
                    type="text" 
                    id="job_field" 
                    name="job_field"
                    placeholder="e.g., Software Engineering, Data Science"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                >
            </div>

            <!-- Company Size Input -->
            <div>
                <label for="company_size" class="block text-sm font-medium text-gray-700 mb-1">Preferred Company Size</label>
                <select 
                    id="company_size" 
                    name="company_size"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 bg-white"
                >
                    <option value="" disabled selected>Select a size</option>
                    <option value="small">Small (1-50 employees)</option>
                    <option value="medium">Medium (51-500 employees)</option>
                    <option value="large">Large (501+ employees)</option>
                </select>
            </div>

            <!-- Preferred Location Input -->
            <div>
                <label for="preferred_location" class="block text-sm font-medium text-gray-700 mb-1">Preferred Location</label>
                <input 
                    type="text" 
                    id="preferred_location" 
                    name="preferred_location"
                    placeholder="e.g., Remote, New York"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                >
            </div>

            <!-- Resume Upload Input -->
            <div>
                <label for="resume" class="block text-sm font-medium text-gray-700 mb-1">Upload Resume</label>
                <input 
                    type="file" 
                    id="resume" 
                    name="resume"
                    required
                    accept=".pdf,.doc,.docx,.txt"
                    class="w-full text-sm text-gray-500
                           file:mr-4 file:py-2 file:px-4
                           file:rounded-lg file:border-0
                           file:text-sm file:font-medium
                           file:bg-blue-50 file:text-blue-600
                           hover:file:bg-blue-100 transition duration-200"
                >
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="submit-button"
                class="w-full bg-blue-600 text-white font-medium py-2.5 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center disabled:opacity-50"
            >
                <!-- Loading spinner (hidden by default) -->
                <div id="loading-spinner" class="spinner w-5 h-5 border-4 border-t-4 border-gray-200 rounded-full mr-3 hidden"></div>
                <span>Orchestrate Agents</span>
            </button>
        </form>

        <!-- Message Area -->
        <div id="message-area" class="mt-4 text-center p-3 rounded-lg hidden"></div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get all necessary elements from the DOM
            const agentForm = document.getElementById('agent-form');
            const submitButton = document.getElementById('submit-button');
            const loadingSpinner = document.getElementById('loading-spinner');
            const messageArea = document.getElementById('message-area');
            const submitButtonText = submitButton.querySelector('span');

            // --- THIS IS THE URL YOU NEED TO REPLACE ---
            // Get this URL from your n8n workflow's webhook trigger node.
            const n8nWebhookUrl = 'YOUR_N8N_WEBHOOK_URL_HERE';
            // ------------------------------------------

            // Listen for the form submission
            agentForm.addEventListener('submit', async (event) => {
                event.preventDefault(); // Prevent the default form reload

                // Show loading state and disable the button
                setLoading(true);
                hideMessage();

                // Get values from the form
                const salary = document.getElementById('salary').value;
                const location = document.getElementById('location').value;
                const nationality = document.getElementById('nationality').value;
                const industry = document.getElementById('industry').value;
                const jobField = document.getElementById('job_field').value;
                const companySize = document.getElementById('company_size').value;
                const preferredLocation = document.getElementById('preferred_location').value;
                const resumeInput = document.getElementById('resume');
                const resumeFile = resumeInput.files[0];

                // Check for resume file
                if (!resumeFile) {
                    showMessage('Please upload a resume.', 'error');
                    setLoading(false);
                    return;
                }

                // Construct the data payload using FormData
                // This is required to handle file uploads
                const formData = new FormData();
                formData.append('salary', parseInt(salary, 10));
                formData.append('location', location);
                formData.append('nationality', nationality);
                formData.append('industry', industry);
                formData.append('job_field', jobField);
                formData.append('company_size', companySize);
                formData.append('preferred_location', preferredLocation);
                formData.append('resume', resumeFile);

                // Check if the webhook URL has been set
                if (n8nWebhookUrl === 'YOUR_N8N_WEBHOOK_URL_HERE') {
                    const errorMsg = 'Frontend Error: Please configure the n8nWebhookUrl variable in the script.';
                    console.error(errorMsg);
                    showMessage(errorMsg, 'error');
                    setLoading(false);
                    return; // Stop execution
                }

                try {
                    // --- This is the API call to your n8n workflow ---
                    const response = await fetch(n8nWebhookUrl, {
                        method: 'POST',
                        // Do NOT set Content-Type header when using FormData,
                        // the browser will automatically set it to 'multipart/form-data'
                        // with the correct boundary.
                        body: formData
                    });

                    // Check if the request was successful
                    if (!response.ok) {
                        // Handle non-2xx responses
                        const errorData = await response.json();
                        throw new Error(errorData.message || `Network error: ${response.statusText}`);
                    }

                    // Handle successful response from n8n
                    const result = await response.json();
                    
                    // Assuming n8n returns a JSON object with a 'message' field on success
                    // e.g., { "message": "Workflow started successfully" }
                    const successMsg = result.message || 'Successfully sent data to n8n!';
                    console.log('n8n Response:', result);
                    showMessage(successMsg, 'success');

                } catch (error) {
                    // Handle fetch errors (network failure, etc.)
                    console.error('Error connecting to n8n:', error);
                    showMessage(`Error: ${error.message}`, 'error');
                } finally {
                    // Always hide the loading state
                    setLoading(false);
                }
            });

            // --- Helper Functions ---

            function setLoading(isLoading) {
                if (isLoading) {
                    submitButton.disabled = true;
                    loadingSpinner.classList.remove('hidden');
                    submitButtonText.textContent = 'Processing...';
                } else {
                    submitButton.disabled = false;
                    loadingSpinner.classList.add('hidden');
                    submitButtonText.textContent = 'Orchestrate Agents';
                }
            }

            function showMessage(message, type) {
                messageArea.textContent = message;
                messageArea.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
                
                if (type === 'success') {
                    messageArea.classList.add('bg-green-100', 'text-green-800');
                } else if (type === 'error') {
                    messageArea.classList.add('bg-red-100', 'text-red-800');
                }
            }

            function hideMessage() {
                messageArea.classList.add('hidden');
                messageArea.textContent = '';
            }
        });
    </script>
</body>
</html>
